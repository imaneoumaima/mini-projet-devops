apiVersion: apps/v1
kind: Deployment
metadata:
  name: teachers
spec:
  replicas: 2
  selector:
    matchLabels:
      app: teachers
  template:
    metadata:
      labels:
        app: teachers
    spec:
      containers:
      - name: teachers
        image: oumaima617/teachers:v1
        ports:
        - containerPort: 5000
